name: Bug report
description: 报告一个缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请**不要粘贴真实对话内容**（涉及他人隐私）——请脱敏或使用构造的样例。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我使用的是最新 `main` 分支
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 手机端上传/接入协议
        - 转写质量（ASR）
        - 因果抽取质量（记错了 / 漏了 / 幻觉）
        - 说话人归属（主人 / 对方 搞反）
        - 上下文卡片（ss brief / MCP）
        - 编辑器注入（ss inject）
        - 部署 / Docker
        - 其他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为，以及你期望的行为
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: shadowscribe doctor 输出
      render: shell
      placeholder: docker compose exec api shadowscribe doctor
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      render: shell
      placeholder: docker compose logs --tail 200 worker
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: 样例（脱敏）
      description: |
        如果是抽取质量问题，请附上**原始转写**与你得到的**上下文卡片**。
        没有样例的抽取质量 issue 通常无法处理。
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: v0.1.0 或 commit sha
    validations:
      required: false
