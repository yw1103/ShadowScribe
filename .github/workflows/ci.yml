name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Deliberately NOT installing faster-whisper / causal-memory here: the unit
      # suite must pass without them, otherwise a fresh clone is broken for anyone
      # lacking that toolchain. numpy *is* included — it is a real transitive
      # dependency of faster-whisper, and the speaker-attribution tests need it.
      - name: Install (lean)
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart sqlmodel pydantic pydantic-settings httpx numpy mcp pytest

      - name: Lint
        working-directory: server
        run: |
          pip install ruff
          ruff check shadowscribe tests
          ruff format --check shadowscribe tests

      - name: Test
        working-directory: server
        run: pytest -q

  client:
    name: client (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        working-directory: client
        run: |
          pip install ruff
          ruff check shadowscribe_client tests
          ruff format --check shadowscribe_client tests

      - name: Test
        working-directory: client
        run: pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          load: true
          tags: shadowscribe:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name ss -p 18080:18080 -e SS_TOKEN=ci-token shadowscribe:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/v1/health
          docker logs ss
          docker rm -f ss
